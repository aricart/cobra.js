name: CI

on:
  push:
    tags:
      - "*"
    branches:
      - "*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        deno-version: [2.9.x]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Deno Version ${{ matrix.deno-version }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Run tests
        env:
          TMPDIR: ${{ runner.temp }}
          CI: true

        run: deno test --allow-all --fail-fast --coverage=./cov

      - name: Generate lcov
        run: deno coverage --lcov ./cov > cov.lcov

  node:
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Versions match
        run: |
          node -e "
            const p = require('./package.json').version;
            const d = require('./deno.json').version;
            if (p !== d) { console.error('package.json ' + p + ' != deno.json ' + d); process.exit(1); }
          "

      - name: Build
        run: |
          npm install
          npm run build

      - name: Test the esm and commonjs builds
        run: npm test

  bun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - name: Use Bun
        uses: oven-sh/setup-bun@v2

      - name: Build
        run: |
          npm install
          npm run build

      - name: Test the esm and commonjs builds
        run: |
          bun tests/node_test.mjs
          bun tests/node_test.cjs
